# Local simulation Redis for kitling_bigqmt.
# Bind only to this host during P01/P05. Do not expose this port to a LAN.

bind 127.0.0.1
protected-mode yes
port 6379
tcp-keepalive 60
timeout 0

# Project-owned persistence on F:.
dir C:/BigQMT/work/kitling_bigqmt/runtime_data/redis/simulation
dbfilename dump-simulation.rdb
appendonly yes
appendfilename appendonly-simulation.aof
appendfsync everysec
save ""

loglevel notice
logfile C:/BigQMT/work/kitling_bigqmt/runtime_data/redis/simulation/redis.log
daemonize no
supervised no

# Authentication will be added through a private runtime configuration before
# any non-local or production connection is permitted.
