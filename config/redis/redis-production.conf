# Local formal-account Redis. Keep it isolated from simulation Redis.
# This instance is for read-only formal QMT validation until a separately
# approved production release exists.

bind 127.0.0.1
protected-mode yes
port 6380
tcp-keepalive 60
timeout 0

dir C:/BigQMT/work/kitling_bigqmt/runtime_data/redis/production
dbfilename dump-production.rdb
appendonly yes
appendfilename appendonly-production.aof
appendfsync everysec
save ""

loglevel notice
logfile C:/BigQMT/work/kitling_bigqmt/runtime_data/redis/production/redis.log
daemonize no
supervised no

# Never bind this service to a LAN address. Authentication belongs in a
# machine-private configuration if a future architecture requires it.
