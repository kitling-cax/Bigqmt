# QMT runtime paths for kitling_bigqmt
# Do not place account passwords or tokens in this file.

version: 1
updated: 2026-09-07

simulation:
  install_root: 'qmt/simulation'
  bin_x64: 'qmt/simulation/bin.x64'
  mode: simulation
  order_enabled: false

production:
  install_root: 'qmt/production_readonly'
  bin_x64: 'qmt/production_readonly/bin.x64'
  mode: production_readonly
  order_enabled: false

policy:
  active_terminal: simulation
  production_orders_allowed: false
  auto_login_enabled: false
