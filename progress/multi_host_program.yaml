safety_invariants:
  - one ACTIVE_EXECUTOR lease per account
  - all other hosts STANDBY_READONLY
  - OpenClaw submits typed intents and never calls QMT Redis or broker RPC directly
  - Windows Host Agent pulls intents; Coordinator does not push into exposed Windows ports
  - Coordinator unavailable means no new orders
  - NAS is never a live lock database or runtime filesystem
  - production account remains READ_ONLY until separate future authorization
  - OpenClaw release packages are read from NAS then installed locally per agent; no live Skill or MCP runtime executes from SMB
  - execution@198.51.100.113 and xiaocai@192.0.2.125 are separate candidate executor identities; only one may receive simulation confirm scope per account at a time

